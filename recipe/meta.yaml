{% set name = "localdeps" %}
{% set version = "0.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/localdeps-{{ version }}.tar.gz
  sha256: 62891d0854e6360a4545fe9991e30b0166f4e6ce6a5e9440afbaf61678093dfa

build:
  entry_points:
    - localdeps = localdeps:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - conda >=4.13
    - conda-build >=3.22

test:
  imports:
    - localdeps
  commands:
    - pip check
    - localdeps --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/cshaley/localdeps
  summary: Install conda package dependencies into a conda environment
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cshaley
